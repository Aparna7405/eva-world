<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVA </title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Space+Grotesk:wght@400;500;600&display=swap');

  :root{
    --ink:      #050b16;
    --deep:     #0b1c3d;
    --electric: #3ea8ff;
    --cyan:     #8fe3ff;
    --white:    #f2f6ff;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    background:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    overflow:hidden;
  }

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    width:100vw;
    height:100svh;
    overflow:hidden;
  }

  .hero__image{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:68% center;
  }

  .hero__scrim{
    position:absolute;
    inset:0;
    background:
      linear-gradient(100deg, rgba(3,7,16,0.96) 0%, rgba(3,7,16,0.86) 22%, rgba(3,7,16,0.35) 46%, rgba(3,7,16,0.05) 62%),
      linear-gradient(to top, rgba(3,7,16,0.75) 0%, rgba(3,7,16,0) 30%);
  }

  .hero__content{
    position:relative;
    z-index:3;
    height:100%;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:6vh 7vw;
    max-width:760px;
  }

  .mark{
    display:flex;
    align-items:center;
    gap:18px;
    margin-bottom:28px;
    opacity:0;
    animation: rise 900ms cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: 1.85s;
  }

  .mark__bolt{
    width:34px;
    height:34px;
    flex-shrink:0;
    filter: drop-shadow(0 0 6px var(--cyan));
  }

  .mark__label{
    font-family:'Space Grotesk', sans-serif;
    font-size:0.82rem;
    font-weight:500;
    letter-spacing:0.14em;
    color:var(--cyan);
  }

  h1.wordmark{
    font-family:'Orbitron', sans-serif;
    font-weight:800;
    font-size:clamp(3.6rem, 11vw, 8rem);
    line-height:0.95;
    letter-spacing:0.04em;
    color:var(--white);
    text-shadow:
      0 0 24px rgba(62,168,255,0.55),
      0 0 60px rgba(62,168,255,0.25);
    opacity:0;
    animation: emerge 1100ms cubic-bezier(.16,.9,.28,1) forwards;
    animation-delay: 1.55s;
  }

  .tagline{
    margin-top:22px;
    max-width:34ch;
    font-size:clamp(1.05rem, 2vw, 1.3rem);
    font-weight:400;
    line-height:1.5;
    color:rgba(242,246,255,0.86);
    opacity:0;
    animation: rise 900ms cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: 2.15s;
  }

  .actions{
    margin-top:44px;
    display:flex;
    align-items:center;
    gap:22px;
    opacity:0;
    animation: rise 900ms cubic-bezier(.2,.8,.2,1) forwards;
    animation-delay: 2.4s;
  }

  .cta{
    position:relative;
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:1.02rem;
    color:var(--ink);
    background:linear-gradient(120deg, var(--cyan), var(--electric));
    padding:16px 40px;
    border-radius:3px;
    letter-spacing:0.01em;
    box-shadow:0 0 0 1px rgba(143,227,255,0.4), 0 8px 30px rgba(62,168,255,0.35);
    transition: transform 220ms ease, box-shadow 220ms ease;
  }
  .cta:hover{
    transform:translateY(-2px);
    box-shadow:0 0 0 1px rgba(143,227,255,0.6), 0 12px 34px rgba(62,168,255,0.5);
  }
  .cta:active{ transform:translateY(0); }
  .cta:focus-visible{
    outline:2px solid var(--cyan);
    outline-offset:3px;
  }

  .signal{
    font-size:0.85rem;
    color:rgba(242,246,255,0.55);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .signal__dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--cyan);
    box-shadow:0 0 8px var(--cyan);
    animation: pulse 1.8s ease-in-out infinite;
    animation-delay: 3s;
  }

  /* Mute toggle */
  .mute{
    position:absolute;
    top:24px;
    right:24px;
    z-index:5;
    width:42px;
    height:42px;
    border-radius:50%;
    border:1px solid rgba(143,227,255,0.35);
    background:rgba(5,11,22,0.55);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:0;
    animation: rise 700ms ease forwards;
    animation-delay: 7s;
  }
  .mute svg{ width:18px; height:18px; }
  .mute:focus-visible{ outline:2px solid var(--cyan); outline-offset:2px; }

  @keyframes emerge{
    from{ opacity:0; transform:translateY(22px) scale(0.985); letter-spacing:0.09em; }
    to{ opacity:1; transform:translateY(0) scale(1); letter-spacing:0.04em; }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  @keyframes pulse{
    0%,100%{ opacity:0.4; }
    50%{ opacity:1; }
  }

  /* ---------- INTRO / SHUTTER ---------- */
  .shutter{
    position:fixed;
    inset:0;
    z-index:10;
    pointer-events:none;
  }
  .shutter__half{
    position:absolute;
    left:0;
    width:100%;
    height:50%;
    background:var(--ink);
  }
  .shutter__half--top{
    top:0;
    animation: shutterUp 900ms cubic-bezier(.7,0,.15,1) forwards;
    animation-delay: 0.75s;
  }
  .shutter__half--bottom{
    bottom:0;
    animation: shutterDown 900ms cubic-bezier(.7,0,.15,1) forwards;
    animation-delay: 0.75s;
  }
  @keyframes shutterUp{
    to{ transform:translateY(-100%); }
  }
  @keyframes shutterDown{
    to{ transform:translateY(100%); }
  }

  .scanline{
    position:fixed;
    left:0;
    top:50%;
    width:100%;
    height:2px;
    transform:translateY(-50%) scaleX(0);
    transform-origin:left center;
    background:linear-gradient(90deg, transparent, var(--cyan) 20%, var(--white) 50%, var(--cyan) 80%, transparent);
    box-shadow:0 0 18px 2px rgba(143,227,255,0.8);
    z-index:11;
    opacity:0;
    animation: scan 550ms ease-out forwards;
    animation-delay: 0.25s;
  }
  @keyframes scan{
    0%{ opacity:1; transform:translateY(-50%) scaleX(0); }
    85%{ opacity:1; transform:translateY(-50%) scaleX(1); }
    100%{ opacity:0; transform:translateY(-50%) scaleX(1); }
  }

  /* Prompt shown only if sound needs a tap to unlock (autoplay policy) */
  .sound-hint{
    position:fixed;
    left:50%;
    bottom:28px;
    transform:translateX(-50%);
    z-index:12;
    font-size:0.78rem;
    letter-spacing:0.04em;
    color:rgba(242,246,255,0.7);
    background:rgba(5,11,22,0.55);
    border:1px solid rgba(143,227,255,0.3);
    padding:8px 16px;
    border-radius:20px;
    backdrop-filter:blur(6px);
    opacity:0;
    animation: hintFade 600ms ease forwards;
    animation-delay: 2.6s;
    pointer-events:none;
    transition:opacity 400ms ease;
  }
  @keyframes hintFade{ to{ opacity:1; } }
  .sound-hint.hidden{ opacity:0 !important; }

  @media (prefers-reduced-motion: reduce){
    .shutter__half, .scanline, .mark, h1.wordmark, .tagline, .actions, .mute{
      animation:none !important;
      opacity:1 !important;
      transform:none !important;
    }
    .shutter{ display:none; }
  }

  @media (max-width: 640px){
    .hero__image{ object-position:74% center; }
    .hero__scrim{
      background:
        linear-gradient(180deg, rgba(3,7,16,0.55) 0%, rgba(3,7,16,0.55) 40%, rgba(3,7,16,0.97) 78%, rgba(3,7,16,1) 100%);
    }
    .hero__content{
      justify-content:flex-end;
      padding:0 7vw 7vh;
      max-width:100%;
    }
    .actions{ flex-direction:column; align-items:flex-start; gap:16px; }
    .cta{ width:100%; text-align:center; }
  }

  /* ---------- EVA CONVERSATIONAL INTERFACE ---------- */
  .chat-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.75); display:none;
    justify-content:center; align-items:center; z-index:1000;
  }
  .chat-overlay.is-open{display:flex;}
  .chat-container{
    width:95%; max-width:500px; height:650px; background:#0b0b1a;
    border:1px solid #00d9ff; border-radius:20px; display:flex;
    flex-direction:column; overflow:hidden; box-shadow:0 0 45px rgba(0,217,255,.25);
    animation:evaChatIn .45s ease both;
  }
  @keyframes evaChatIn{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
  .chat-header{padding:16px 20px; display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(90deg,#1a1033,#061b24);}
  .chat-identity{display:flex;align-items:center;gap:12px;}
  .eva-avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;object-position:68% center;
    border:1px solid #00d9ff;box-shadow:0 0 18px rgba(0,217,255,.55);}
  .chat-header h3{margin:0;color:#fff;font-family:'Orbitron',sans-serif;font-size:18px;}
  .chat-header span{color:#00ffb3;font-size:10px;letter-spacing:.08em;}
  .close-btn{background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;}
  .chat-box{flex:1;padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:15px;}
  .message{max-width:80%;padding:13px 16px;border-radius:15px;line-height:1.5;color:#fff;font-family:'Space Grotesk',sans-serif;}
  .bot-message{align-self:flex-start;background:rgba(124,58,237,.4);}
  .user-message{align-self:flex-end;background:#00a9c7;}
  .chat-input-area{display:flex;padding:15px;gap:10px;}
  .chat-input-area input{flex:1;padding:14px;border:none;border-radius:8px;background:#151526;color:#fff;outline:none;font-family:'Space Grotesk',sans-serif;}
  .chat-input-area button{width:50px;border:none;border-radius:8px;background:#7c3aed;color:#fff;cursor:pointer;font-size:18px;}
  @media(max-width:600px){.chat-container{height:86vh}.chat-overlay{padding:10px}.chat-container{width:calc(100% - 20px)}}

</style>
</head>

      </div>

<script src="script.js?v=2"></script>
<script>
(function(){
  var muted = false;
  var unlocked = false;
  var audioCtx = null;
  var femaleVoice = null;
  var hint = document.getElementById('soundHint');
  var muteBtn = document.getElementById('muteBtn');
  var iconSound = document.getElementById('iconSound');
  var iconMute = document.getElementById('iconMute');

  function getAudioCtx(){
    if (!audioCtx){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      audioCtx = new Ctx();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // Synthesized "power surge" whoosh for the shutter reveal
  function playPowerUp(){
    if (muted) return;
    var ctx = getAudioCtx();
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(70, t0);
    osc.frequency.exponentialRampToValueAtTime(640, t0 + 0.5);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.6);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.65);
  }

  // Short confirm blip for the button
  function playBlip(){
    if (muted) return;
    var ctx = getAudioCtx();
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(660, t0);
    osc.frequency.exponentialRampToValueAtTime(900, t0 + 0.12);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.2, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.18);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + 0.2);
  }

  function pickFemaleVoice(){
    var voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
    if (!voices.length) return null;
    var preferred = voices.find(function(v){
      return /female|samantha|victoria|zira|susan|karen|moira|tessa|fiona|google us english/i.test(v.name);
    });
    return preferred || voices.find(function(v){ return v.lang && v.lang.indexOf('en') === 0; }) || voices[0];
  }

  if (window.speechSynthesis){
    window.speechSynthesis.onvoiceschanged = function(){
      femaleVoice = pickFemaleVoice();
    };
    femaleVoice = pickFemaleVoice();
  }

  function speak(text, opts){
    if (muted || !window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    if (femaleVoice) u.voice = femaleVoice;
    u.pitch = (opts && opts.pitch) || 1.05;
    u.rate = (opts && opts.rate) || 0.98;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  }

  function runIntroAudio(){
    if (unlocked) return;
    unlocked = true;
    hint.classList.add('hidden');
    playPowerUp();
    setTimeout(function(){
      speak('Systems online. Identity confirmed: EVA.');
    }, 550);
  }

  // Try to start immediately (works in some embedded/local contexts);
  // otherwise the first tap/click/key anywhere unlocks it.
  document.addEventListener('pointerdown', runIntroAudio, { once:true });
  document.addEventListener('keydown', runIntroAudio, { once:true });
  window.addEventListener('load', function(){
    setTimeout(function(){
      var ctx;
      try { ctx = getAudioCtx(); } catch(e){ ctx = null; }
      if (ctx && ctx.state === 'running') runIntroAudio();
    }, 100);
  });

  document.getElementById('ctaBtn').addEventListener('click', function(){
    runIntroAudio();
    playBlip();
    speak("Let's go.", { rate: 1 });
  });

  muteBtn.addEventListener('click', function(){
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
    iconSound.style.display = muted ? 'none' : 'block';
    iconMute.style.display = muted ? 'block' : 'none';
    if (muted && window.speechSynthesis) window.speechSynthesis.cancel();
  });
})();
</script>
